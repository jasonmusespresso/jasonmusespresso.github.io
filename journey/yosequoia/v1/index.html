<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#F3EDE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>根与石 · v1（旧版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3EDE1; --envelope: #EADFC9; --envelope-d: #DCCDB1; --ink: #2B2A26; --ink-soft: #5E5A52;
    --stone: #8E8B84; --forest: #2F4B3C; --rust: #9A4529; --gold: #C8A15A; --rose: #E8A28C; --blue: #5F8097;
    --hand: "ZCOOL XiaoWei", "Songti SC", "Noto Serif SC", serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 18px; color: var(--ink);
         font: 16px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
         background: var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .scene { width: 100%; max-width: 440px; perspective: 1200px; }
  .envelope { position: relative; background: var(--envelope); border-radius: 6px; padding: 92px 30px 30px;
              box-shadow: 0 2px 3px rgba(43,42,38,.08), 0 22px 50px rgba(43,42,38,.16); }
  .flap { position: absolute; inset: 0 0 auto 0; height: 120px; transform-origin: top; transition: transform .7s ease;
          background: linear-gradient(170deg, var(--envelope-d), var(--envelope)); clip-path: polygon(0 0, 100% 0, 50% 100%);
          border-radius: 6px 6px 0 0; z-index: 2; }
  .seal { position: absolute; left: 50%; top: 92px; width: 58px; height: 58px; margin-left: -29px; border-radius: 50%; z-index: 3;
          background: radial-gradient(circle at 35% 30%, #c0603d, var(--rust) 60%, #7a321c); display: grid; place-items: center;
          box-shadow: 0 3px 6px rgba(80,30,15,.35); transition: opacity .3s, transform .4s; }
  .stampbox { position: absolute; top: 16px; right: 18px; width: 54px; height: 64px; background: #fff; padding: 4px; z-index: 1;
              transform: rotate(4deg); outline: 2px dotted #fff; outline-offset: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .postmark { position: absolute; top: 20px; right: 60px; width: 70px; height: 70px; border: 1.5px solid rgba(95,128,151,.6); border-radius: 50%;
              color: rgba(95,128,151,.8); font: 600 11px/1.15 "Caveat", cursive; display: grid; place-items: center; text-align: center; transform: rotate(-14deg); z-index: 1; }
  .to { font-family: var(--hand); font-size: 34px; line-height: 1.1; color: var(--rust); margin: 22px 0 2px; }
  .sub { font-family: "Caveat", var(--hand); font-size: 20px; color: var(--stone); margin: 0 0 18px; }
  .note { color: var(--ink-soft); font-size: 15px; margin: 0 0 22px; }
  label.f { display: block; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 4px; }
  input.code { width: 100%; border: 0; border-bottom: 2px solid var(--stone); background: transparent; padding: 6px 2px; color: var(--ink);
               font: 600 24px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .3em; }
  input.code:focus { outline: none; border-bottom-color: var(--rust); }
  .hint { font-size: 12.5px; color: var(--stone); margin-top: 6px; }
  .remember { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-soft); margin: 14px 0 0; cursor: pointer; }
  .remember input { accent-color: var(--forest); }
  .open { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 999px; background: var(--forest); color: #fff;
          font: 600 16px/1.4 inherit; letter-spacing: .1em; cursor: pointer; }
  .open:disabled { opacity: .6; cursor: wait; }
  .open:focus-visible, input:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .error { min-height: 24px; margin: 10px 0 0; font-size: 14px; color: var(--rust); }
  .opening .flap { transform: rotateX(180deg); }
  .opening .seal { opacity: 0; transform: scale(.6); }
  .opening .envelope { animation: lift .8s ease .35s forwards; }
  @keyframes lift { to { transform: translateY(-14px); box-shadow: 0 30px 60px rgba(43,42,38,.22); } }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .flap, .seal { transition: none; } .opening .envelope, .shake { animation: none; } }
</style>
</head>
<body>
<div class="scene" id="scene">
  <main class="envelope" id="envelope">
    <div class="flap" aria-hidden="true"></div>
    <div class="seal" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30"><path d="M3 22 L11 10 L15 15 L19 8 L27 22Z" fill="none" stroke="#f6dccf" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
    <div class="stampbox" aria-hidden="true">
      <svg viewBox="0 0 46 56" width="46" height="56"><rect width="46" height="56" fill="#E8A28C"/><circle cx="33" cy="15" r="6" fill="#F7E3B5"/><path d="M0 44 L14 24 L22 34 L30 20 L46 42 V56 H0Z" fill="#2F4B3C"/><path d="M0 50 L46 48 V56 H0Z" fill="#9A4529"/></svg>
    </div>
    <div class="postmark" aria-hidden="true">ROOTS<br>&amp; STONE<br>2026</div>

    <div class="to">致我们</div>
    <p class="sub">The Cathedral of Roots and Stone</p>
    <p class="note">以石为穹顶，以古树为立柱：优胜美地与红杉的旅行手帐。输入密码，拆开它。</p>
    <form id="unlock" novalidate>
      <label class="f" for="code">拆信密码</label>
      <input class="code" id="code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" required aria-describedby="hint error">
      <div class="hint" id="hint">刻在石头上的那串数字</div>
      <label class="remember"><input type="checkbox" id="remember"> 在这台手机上记住（离线也能看）</label>
      <button class="open" id="button" type="submit">拆开信封</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <noscript>请开启 JavaScript 才能拆开这封信。</noscript>
  </main>
</div>
<script>
(() => {
"use strict";
const PIN_LENGTH = 10;          // 0 = free-form password
const T = {
  open: "拆开信封", loading: "正在拆信…",
  invalid: PIN_LENGTH ? "密码是 " + PIN_LENGTH + " 位数字哦" : "先输入密码哦",
  wrong: "不对哦，再想想～",
  network: "信还没送到，检查一下网络再试试。",
  crypto: "请用新版浏览器打开这个 https 链接。",
};
const $ = id => document.getElementById(id);
const form = $("unlock"), field = $("code"), button = $("button"), message = $("error");
const KEY = "unlock:" + location.pathname;

const say = (key, busy = false) => {
  button.disabled = busy;
  button.textContent = busy ? T.loading : T.open;
  message.textContent = key ? T[key] : "";
  if (key === "wrong" || key === "invalid") {
    $("envelope").classList.remove("shake"); void $("envelope").offsetWidth; $("envelope").classList.add("shake");
  }
};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function payload() {
  const res = await fetch("content.enc.json", { cache: "no-cache" });
  if (!res.ok) throw Error("network");
  const p = await res.json();
  if (p.version !== 2 || !p.iterations) throw Error("network");
  return p;
}
const decrypt = async (p, key) =>
  new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(p.iv) }, key, bytes(p.data)));
function show(page, animate) {
  const write = () => { document.open(); document.write(page); document.close(); };
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return write();
  $("scene").classList.add("opening");
  setTimeout(write, 1100);
}

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

// Remembered on this device: open straight away. Pages published with a shared salt
// (e.g. older versions in v1/) also open with a key remembered on a sibling page.
(async () => {
  if (!window.crypto?.subtle) return;
  const names = [KEY, ...Object.keys(localStorage).filter(k => k.startsWith("unlock:") && k !== KEY)];
  const saved = names.map(k => [k, localStorage.getItem(k)]).filter(([, v]) => v);
  if (!saved.length) return;
  let p;
  try { p = await payload(); } catch { return; }
  for (const [name, raw] of saved) {
    try {
      const key = await crypto.subtle.importKey("raw", bytes(raw), "AES-GCM", false, ["decrypt"]);
      const page = await decrypt(p, key);
      if (name !== KEY) localStorage.setItem(KEY, raw);
      return show(page, false);
    } catch { if (name === KEY) localStorage.removeItem(KEY); }
  }
})();

form.addEventListener("submit", async event => {
  event.preventDefault();
  let code = field.value.replace(/[\s-]/g, "");
  if (PIN_LENGTH ? !new RegExp("^\\d{" + PIN_LENGTH + "}$").test(code) : !code) return say("invalid");
  if (!window.crypto?.subtle) return say("crypto");
  say("", true);
  let p;
  try { p = await payload(); } catch { code = ""; return say("network"); }
  let page, key;
  try {
    const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
    code = "";
    key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(p.salt), iterations: p.iterations, hash: "SHA-256" },
      material, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    page = await decrypt(p, key);   // fails unless the code is right (AES-GCM authentication)
  } catch { field.value = ""; field.focus(); return say("wrong"); }
  if ($("remember").checked) {
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    localStorage.setItem(KEY, btoa(String.fromCharCode(...raw)));
  }
  field.value = "";
  show(page, true);
});
})();
</script>
</body>
</html>

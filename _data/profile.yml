bio: |
  I'm a machine learning engineer at [Apple](https://machinelearning.apple.com/) in New York City, where I work on the multilinguality of [Apple's Foundation Models](https://machinelearning.apple.com/research/introducing-third-generation-of-apple-foundation-models), with a focus on the audio modality. Before that, I worked on their [real-time speech-to-speech translation](https://www.apple.com/newsroom/2025/09/new-apple-intelligence-features-are-available-today/) capability.

  I received my Master's from the [Language Technologies Institute](https://www.lti.cs.cmu.edu/) at Carnegie Mellon University, where I worked with [Graham Neubig](https://www.phontron.com/) on multidimensional evaluation for question-answering systems.

  Before that, I earned my Bachelor's in Computer Science at the University of Michigan, where I was advised by [David Jurgens](https://jurgens.people.si.umich.edu/) on large-scale data mining for online conversations, and worked with [Rada Mihalcea](https://web.eecs.umich.edu/~mihalcea/) on video understanding, specifically human action localization.

